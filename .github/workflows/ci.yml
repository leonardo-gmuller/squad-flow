name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum
      - name: Check SQLC queries and generated code
        run: make sqlc-check
      - name: Check generated mocks
        run: make mocks-check
      - name: Lint Go code
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: backend
          args: --config ../.golangci.yml --build-tags integration
      - name: Vet Go code including integration tests
        working-directory: backend
        run: go vet -tags=integration ./...
      - name: Run Go unit tests
        run: make test-unit
      - name: Run integration tests with Testcontainers
        run: make test-integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Check frontend lint and formatting
        working-directory: frontend
        run: |
          npm run lint
          npm run format:check
      - name: Build Vue application and check TypeScript
        working-directory: frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      JWT_SECRET: ci-test-only-jwt-secret-at-least-32-bytes
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: ci-test-admin-password
      E2E_EMAIL: ci-admin@example.com
      E2E_PASSWORD: ci-test-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start Docker environment
        run: docker compose up -d --build
      - name: Wait for frontend/API readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 3
          done
          docker compose logs --tail=150
          exit 1
      - name: Install browser and execute E2E
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Show docker logs on failure
        if: failure()
        run: docker compose logs --tail=250
      - name: Stop services
        if: always()
        run: docker compose down -v
