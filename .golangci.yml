---
run:
  timeout: 30m
  tests: true

linters-settings:
  exhaustive:
    default-signifies-exhaustive: true
  gci:
    sections:
      - standard
      - default
      - prefix(github.com)
      - prefix(github.com/leonardo-gmuller/squad-flow/backend)
      - blank
      - dot
  goimports:
    local-prefixes: github.com/leonardo-gmuller/squad-flow/backend
  govet:
    enable:
      - shadow
  misspell:
    ignore-words:
      - essencial
      - independente
      - componentes
      - demandas
      - contextos
      - argumentos
  tagalign:
    order:
      - required
      - envconfig
      - json
      - extensions
      - validate
      - example
    sort: true
  varnamelen:
    ignore-decls:
      - i int
      - rw http.ResponseWriter
      - w http.ResponseWriter
      - r *http.Request
    ignore-names:
      - db
      - fn
      - id
      - ok
      - tc
      - tt
      - tx
      - wg
    ignore-type-assert-ok: true


linters:
  enable-all: true
  disable:
    - cyclop
    - depguard
    - dupl
    - exhaustruct
    - funlen
    - gochecknoglobals
    - godox
    - err113
    - ireturn
    - lll
    - maintidx
    - tagliatelle
    - testpackage
    - tenv # replaced by the enabled usetesting linter
    - mnd # renamed from gomnd
    # execinquery was removed from golangci-lint.
