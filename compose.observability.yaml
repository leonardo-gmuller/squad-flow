# Local development only: Collector + Grafana + Prometheus + Tempo + Loki.
services:
  otel-lgtm:
    image: grafana/otel-lgtm:0.37.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_PATHS_PROVISIONING: /etc/squadflow/grafana/provisioning
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4318:4318"
    volumes:
      - oteldata:/data
      - ./observability/grafana/provisioning:/etc/squadflow/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/squadflow/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  oteldata:
