services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: squadflow
      POSTGRES_USER: squadflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squadflow -d squadflow"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build: ./backend
    environment: &backend_environment
      PROCESS_ROLE: api
      REDIS_URL: redis://redis:6379/0
      REPORT_QUEUE_STREAM: squadflow:reports
      REPORT_QUEUE_GROUP: report-workers
      REPORT_WORKER_CONCURRENCY: ${REPORT_WORKER_CONCURRENCY:-2}
      DATABASE_URL: postgres://squadflow:${POSTGRES_PASSWORD:-dev_only_change_me}@db:5432/squadflow?sslmode=disable
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DEMO_SEED: ${DEMO_SEED:-true}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET com pelo menos 32 bytes}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_STORE_RESPONSES: ${OPENAI_STORE_RESPONSES:-false}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      AI_REPORT_TIMEOUT: ${AI_REPORT_TIMEOUT:-210s}
      SERVER_WRITE_TIMEOUT: ${SERVER_WRITE_TIMEOUT:-30s}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    environment:
      <<: *backend_environment
      PROCESS_ROLE: worker
      DEMO_SEED: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
